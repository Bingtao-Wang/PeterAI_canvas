services:
  app:
    image: ${PETERAI_CANVAS_IMAGE:?PETERAI_CANVAS_IMAGE is required}
    container_name: peterai-canvas
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:13000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
