log_format peter_no_args '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 127.0.0.1:13000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log peter_no_args;

    client_max_body_size 100m;
    add_header Content-Security-Policy "frame-ancestors https://api.peterai.cc.cd https://api.peteraix.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /peter-api/api/v1/auth/me {
        if ($request_method != GET) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/peter-api/api/v1/(?:keys|user/image-generation/options|channels/available)$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location = /peter-api/api/v1/gallery/items {
        if ($request_method != POST) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location = /peter-api/v1/models {
        if ($request_method != GET) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/peter-api/v1/(?:responses|images/generations|images/edits|audio/speech)$ {
        if ($request_method != POST) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    # Canvas 使用 OpenAI 的 POST /v1/videos，当前 Sub2API 的真实创建路由是
    # POST /v1/videos/generations；只在这一条精确路径做兼容改写。
    location = /peter-api/v1/videos {
        if ($request_method != POST) { return 405; }
        rewrite ^ /v1/videos/generations break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/peter-api/v1/videos/[A-Za-z0-9._-]+(?:/content)?$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location = /peter-api/v1/contents/generations/tasks {
        if ($request_method != POST) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/peter-api/v1/contents/generations/tasks/[A-Za-z0-9._-]+$ {
        if ($request_method != GET) { return 405; }
        rewrite ^/peter-api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
    }

    location /peter-api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "frame-ancestors https://api.peterai.cc.cd https://api.peteraix.com" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
